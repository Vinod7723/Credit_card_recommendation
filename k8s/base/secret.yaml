apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: credit-card-system
type: Opaque
data:
  # Base64 encoded secrets - replace with actual values
  # To encode: echo -n "your-api-key" | base64
  # IMPORTANT: DO NOT commit actual secrets to git
  # Use external secret management (AWS Secrets Manager, Sealed Secrets, etc.)
  OPENAI_API_KEY: ""  # Add base64 encoded OpenAI API key here
stringData:
  # Alternative: Use stringData for non-base64 encoded values
  # These will be automatically base64 encoded by Kubernetes
  # OPENAI_API_KEY: "your-api-key-here"
